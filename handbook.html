<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>講義與教案｜流行歌唱班</title>
<meta name="description" content="亞東吉他社流行歌唱班六堂課的講義與教案：課前問卷、120 分鐘課程綱要、擴充講義與課後練習。">
<meta name="theme-color" content="#060607">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a href="index.html" aria-label="Pixel Studio 首頁" data-pixel-word="PIXEL"></a>
    <nav>
      <a href="index.html#lessons">課程</a>
      <a href="handbook.html">講義與教案</a>
      <a href="index.html#about">關於</a>
    </nav>
  </div>
</header>
<div class="rainbow-rule"></div>
<div class="toc"><div class="wrap" id="toc"></div></div>

<main class="wrap md" id="content"><p class="loading">講義載入中…</p></main>

<footer>
  <div class="wrap">© 畫素音樂工作坊 Pixel Studio　·　亞東科技大學吉他社 流行歌唱班</div>
</footer>
<script src="assets/pixel.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(function () {
  var NUM = { '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6 };
  var main = document.getElementById('content'), toc = document.getElementById('toc');
  fetch('docs/course-handbook.md')
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (md) {
      main.innerHTML = marked.parse(md, { gfm: true });
      main.querySelectorAll('h2').forEach(function (h) {
        var m = h.textContent.match(/第([一二三四五六])堂/);
        h.id = m ? 'lesson-' + NUM[m[1]] : 'overview';
        var a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = m ? '第' + m[1] + '堂' : h.textContent.trim();
        toc.appendChild(a);
      });
      main.querySelectorAll('input[type=checkbox]').forEach(function (c) { c.removeAttribute('disabled'); });
      if (location.hash) { var t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
    })
    .catch(function () {
      main.innerHTML = '<p class="loading">講義無法載入，請改看 <a href="https://github.com/leoleehr/vocal_music/blob/main/docs/course-handbook.md">GitHub 上的版本</a>。</p>';
    });
})();
</script>
</body>
</html>
