<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(function () {
  var NUM = { '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6 };
  var COLOR = ['', '#e8412b', '#e2407f', '#9a5fd0', '#45b3e6', '#6cbb4b', '#e3d83a'];
  var main = document.getElementById('content'), toc = document.getElementById('toc'), prog = document.getElementById('progress');
  fetch('docs/course-handbook.md')
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (md) {
      main.innerHTML = marked.parse(md, { gfm: true });
      var heads = [], items = [];
      main.querySelectorAll('h2,h3').forEach(function (h) {
        if (h.tagName === 'H3') {
          var parent = heads[heads.length - 1];
          h.id = (parent ? parent.id : 'sec') + '-' + (items.length + 1);
          items.push({ href: '#' + h.id, label: h.textContent.trim(), sub: true });
          return;
        }
        var m = h.textContent.match(/第([一二三四五六])堂/), n = m ? NUM[m[1]] : 0;
        var id = n ? 'lesson-' + n : 'overview';
        var head = document.createElement('div'); head.className = 'lesson-head'; head.id = id;
        if (n) head.style.setProperty('--c', COLOR[n]);
        var parts = h.textContent.split(/\s(?=[A-Z])/);
        head.innerHTML = '<div class="lh-no">' + (n ? 'LESSON ' + String(n).padStart(2, '0') : 'OVERVIEW') + '</div>';
        var h2 = document.createElement('h2'); h2.textContent = parts[0].replace(/^第.堂｜/, '').trim();
        if (parts[1]) { var s = document.createElement('small'); s.textContent = parts.slice(1).join(' '); h2.appendChild(s); }
        head.appendChild(h2); h.parentNode.replaceChild(head, h);
        heads.push(head);
        var a = document.createElement('a'); a.href = '#' + id; a.textContent = n ? '第' + m[1] + '堂' : '課程總覽'; a.setAttribute('data-id', id); toc.appendChild(a);
        items.push({ href: '#' + id, label: n ? '第' + m[1] + '堂　' + parts[0].replace(/^第.堂｜/, '').trim() : '課程總覽', dot: n ? COLOR[n] : null });
      });
      main.querySelectorAll('input[type=checkbox]').forEach(function (c) { c.removeAttribute('disabled'); });
      // 每堂開頭放「本堂歌曲」，內文的《歌名》後面加上播放鈕
      heads.forEach(function (h) {
        var n = parseInt((h.id.match(/lesson-(\d)/) || [])[1], 10), list = (window.PIXEL_LESSON_SONGS || {})[n];
        if (!list) return;
        var sl = document.createElement('a'); sl.className = 'survey-link'; sl.href = 'survey.html?id=pre-' + n; sl.textContent = '填寫第 ' + n + ' 堂課前問卷 →'; h.parentNode.insertBefore(sl, h.nextSibling);
        var box = document.createElement('div'); box.className = 'lesson-songs';
        box.innerHTML = '<div class="ls-title">本堂歌曲<span>點縮圖即可播放</span></div><div class="yt-list"></div>';
        list.forEach(function (s) { box.lastChild.appendChild(PixelYT.card(s)); });
        h.parentNode.insertBefore(box, sl.nextSibling);
      });
      var names = Object.keys(PixelYT.songs).sort(function (a, b) { return b.length - a.length; });
      var re = new RegExp('《(' + names.join('|') + ')》', 'g'), walker = document.createTreeWalker(main, NodeFilter.SHOW_TEXT), nodes = [];
      while (walker.nextNode()) { var nd = walker.currentNode; if (re.test(nd.nodeValue) && !nd.parentNode.closest('h2,h3,.lesson-head,.yt-card')) nodes.push(nd); re.lastIndex = 0; }
      nodes.forEach(function (nd) {
        var frag = document.createDocumentFragment(), txt = nd.nodeValue, last = 0, m;
        re.lastIndex = 0;
        while ((m = re.exec(txt))) { frag.appendChild(document.createTextNode(txt.slice(last, m.index + m[0].length))); frag.appendChild(PixelYT.chip(m[1])); last = m.index + m[0].length; }
        frag.appendChild(document.createTextNode(txt.slice(last))); nd.parentNode.replaceChild(frag, nd);
      });
      PixelUI.labelTables(main);
      var sh = PixelUI.sheet('講義目錄', items);
      [].forEach.call(sh.list.children, function (a, k) { if (items[k].sub) a.classList.add('sub'); });
      var fab = document.createElement('button'); fab.type = 'button'; fab.className = 'toc-fab'; fab.innerHTML = PixelUI.ICON.list + '目錄'; fab.onclick = sh.open; document.body.appendChild(fab);
      var chips = [].slice.call(toc.children);
      function onScroll() {
        var max = document.documentElement.scrollHeight - innerHeight;
        prog.style.width = (max > 0 ? scrollY / max * 100 : 0) + '%';
        var cur = heads[0];
        heads.forEach(function (h) { if (h.getBoundingClientRect().top < innerHeight * 0.3) cur = h; });
        chips.forEach(function (c) {
          var on = cur && c.getAttribute('data-id') === cur.id;
          if (on && !c.classList.contains('cur')) c.scrollIntoView({ block: 'nearest', inline: 'center' });
          c.classList.toggle('cur', on);
        });
      }
      addEventListener('scroll', onScroll, { passive: true }); onScroll();
      if (location.hash) { var t = document.getElementById(location.hash.slice(1)); if (t) window.scrollTo({ top: t.getBoundingClientRect().top + scrollY - (innerWidth <= 860 ? 110 : 124), behavior: 'instant' }); }
    })
    .catch(function () {
      main.innerHTML = '<p class="loading">講義無法載入，請改看 <a href="https://github.com/leoleehr/vocal_music/blob/main/docs/course-handbook.md">GitHub 上的版本</a>。</p>';
    });
})();
</script>
