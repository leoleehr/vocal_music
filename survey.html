<style>
.sv{max-width:760px;padding-top:28px;padding-bottom:40px}
.sv-head{margin-bottom:20px}
.sv-head .lh-no{font-family:var(--display);font-size:13px;letter-spacing:.2em;color:var(--c,var(--amber));font-weight:700}
.sv-head h1{font-size:28px;font-weight:700;letter-spacing:.02em;line-height:1.35;margin-top:4px}
.sv-head p{color:var(--muted);font-size:15px;margin-top:6px}
.sv-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:12px}
.sv-card.who{border-color:rgba(199,175,74,.35);background:linear-gradient(120deg,rgba(199,175,74,.08),rgba(199,175,74,.02))}
.sv-card.who .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.sv-q{font-size:16px;font-weight:700;line-height:1.5;margin-bottom:4px;display:flex;gap:10px}
.sv-q .n{font-family:var(--display);color:var(--amber);flex:none;min-width:22px}
.sv-q .opt{font-size:12px;color:var(--faint);font-weight:400;margin-left:auto;flex:none}
.sv-hint{font-size:13px;color:var(--muted);margin:0 0 8px 32px}
.sv-body{margin:10px 0 0 32px}
.sv label.f{display:block}
.sv label.f span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.sv input[type=text],.sv input[type=number],.sv textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#0d0d10;border:1px solid var(--line-2);border-radius:12px;padding:10px 13px;outline:none}
.sv textarea{min-height:84px;resize:vertical;line-height:1.6}
.sv input:focus,.sv textarea:focus{border-color:var(--amber)}
.sv .num{display:flex;align-items:center;gap:10px;max-width:260px}
.sv .num span{color:var(--muted);font-size:14px;white-space:nowrap}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills label{position:relative;cursor:pointer}
.pills input{position:absolute;opacity:0;pointer-events:none}
.pills span{display:inline-flex;align-items:center;min-height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--card-2);font-size:15px;transition:all .15s}
.pills input:checked+span{background:var(--amber);border-color:var(--amber);color:#1a1200;font-weight:700}
.pills input:focus-visible+span{outline:2px solid var(--amber);outline-offset:2px}
.scale{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.scale .pills span{width:46px;justify-content:center;padding:0;font-family:var(--display)}
.scale small{font-size:12.5px;color:var(--muted)}
.matrix .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.matrix .row:last-child{border-bottom:0}
.matrix .row b{font-size:15px;font-weight:500}
.matrix .pills span{width:42px;min-height:38px;justify-content:center;padding:0;font-family:var(--display)}
.other{margin-top:8px;max-width:360px}
.sv-err{color:var(--red);font-size:13px;margin-top:8px;display:none}
.sv-card.bad{border-color:rgba(236,74,54,.6)}
.sv-card.bad .sv-err{display:block}
.sv-submit{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:18px}
.sv-submit .btn{min-width:200px}
.sv-submit p{font-size:13px;color:var(--muted)}
.sv-done{text-align:center;padding:48px 20px}
.sv-done .ok{width:64px;height:64px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;background:rgba(108,187,75,.15);color:var(--green);font-size:30px}
.sv-done h2{font-size:24px;margin-bottom:8px}
.sv-done p{color:var(--muted)}
.sv-done .cta{margin-top:22px}
.sv-list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sv-item{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-decoration:none;color:var(--ink);transition:border-color .15s}
.sv-item:hover{border-color:var(--amber)}
.sv-item .no{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#0b0b0b;background:var(--c)}
.sv-item b{display:block;font-size:16px}
.sv-item small{display:block;font-size:13px;color:var(--muted)}
.sv-item .st{margin-left:auto;font-size:12px;border-radius:999px;padding:3px 10px;white-space:nowrap;border:1px solid var(--line-2);color:var(--muted)}
.sv-item .st.done{border-color:rgba(108,187,75,.5);color:var(--green)}
.sv-notice{font-size:13.5px;color:var(--amber);background:rgba(199,175,74,.08);border:1px solid rgba(199,175,74,.35);border-radius:12px;padding:10px 14px;margin-bottom:14px}
@media (max-width:860px){
  .sv{padding-top:18px}
  .sv-head h1{font-size:22px}
  .sv-card{padding:16px}
  .sv-card.who .grid{grid-template-columns:1fr}
  .sv-hint,.sv-body{margin-left:0}
  .sv-list{grid-template-columns:1fr}
  .matrix .row{flex-direction:column;align-items:flex-start;gap:6px}
  .sv-submit .btn{width:100%}
}
</style>

<script>
(function () {
  'use strict';
  var COLOR = ['', '#e8412b', '#e2407f', '#9a5fd0', '#45b3e6', '#6cbb4b', '#e3d83a'];
  var app = document.getElementById('app'), id = new URLSearchParams(location.search).get('id');
  var list = window.PIXEL_SURVEYS || [], sv = list.filter(function (s) { return s.id === id; })[0];
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function doneAt(sid) { try { return localStorage.getItem('pixel:survey-' + sid); } catch (e) { return null; } }
  var notice = PixelBackend.configured ? '' : '<div class="sv-notice">後台尚未完成設定：送出的問卷會先存在這台裝置，設定完成後自動補送給老師。</div>';

  if (!sv) {
    app.innerHTML = '<div class="sv-head"><div class="lh-no">SURVEYS</div><h1>課程問卷</h1><p>每堂課前三天填寫課前問卷，結業當天填寫課程回饋。填寫後會直接送到老師的課程試算表。</p></div>' + notice + '<div class="sv-list"></div>';
    list.forEach(function (s) {
      var d = doneAt(s.id), a = document.createElement('a'); a.className = 'sv-item'; a.href = 'survey.html?id=' + s.id;
      a.style.setProperty('--c', s.id === 'feedback' ? '#C7AF4A' : COLOR[s.lesson]);
      a.innerHTML = '<div class="no">' + (s.id === 'feedback' ? '★' : String(s.lesson).padStart(2, '0')) + '</div><div><b>' + esc(s.title) + '</b><small>' + s.questions.length + ' 題・' + esc(s.intro) + '</small></div><span class="st' + (d ? ' done' : '') + '">' + (d ? '已填寫' : '未填寫') + '</span>';
      app.querySelector('.sv-list').appendChild(a);
    });
    return;
  }

  document.title = sv.title + '｜流行歌唱班';
  var p = PixelBackend.profile() || {};
  var html = '<div class="sv-head" style="--c:' + (sv.id === 'feedback' ? '#C7AF4A' : COLOR[sv.lesson]) + '"><div class="lh-no">' + (sv.id === 'feedback' ? 'FEEDBACK' : 'LESSON ' + String(sv.lesson).padStart(2, '0') + '・PRE-CLASS') + '</div><h1>' + esc(sv.title) + '</h1><p>' + esc(sv.intro) + '</p></div>' + notice +
    (doneAt(sv.id) ? '<div class="sv-notice" style="color:var(--green);border-color:rgba(108,187,75,.4);background:rgba(108,187,75,.06)">你已在 ' + esc(doneAt(sv.id)) + ' 填寫過這份問卷，再次送出會新增一筆回覆。</div>' : '') +
    '<form novalidate><div class="sv-card who"><div class="sv-q"><span class="n">✦</span>填寫者資料</div><div class="sv-body" style="margin-left:0"><div class="grid">' +
    '<label class="f"><span>姓名</span><input type="text" name="_name" autocomplete="name" maxlength="30" value="' + esc(p.name) + '"></label>' +
    '<label class="f"><span>科系</span><input type="text" name="_dept" list="sv-depts" maxlength="40" placeholder="例如：資訊工程系" value="' + esc(p.dept) + '"></label>' +
    '<label class="f"><span>課程代碼</span><input type="text" name="_code" autocomplete="off" maxlength="30" placeholder="老師在課堂上公布" value="' + esc(p.code) + '"></label>' +
    '</div><datalist id="sv-depts"><option value="資訊工程系"><option value="電機工程系"><option value="電子工程系"><option value="機械工程系"><option value="通訊工程系"><option value="材料與纖維系"><option value="工業管理系"><option value="資訊管理系"><option value="行銷與流通管理系"><option value="醫務管理系"><option value="護理系"><option value="應用外語系"></datalist><p class="sv-err">請填寫姓名、科系與課程代碼</p></div></div>';
  sv.questions.forEach(function (q, k) {
    var name = 'q' + k, body = '';
    if (q.type === 'single' || q.type === 'multi') {
      body = '<div class="pills">' + q.options.map(function (o) { return '<label><input type="' + (q.type === 'single' ? 'radio' : 'checkbox') + '" name="' + name + '" value="' + esc(o) + '"><span>' + esc(o) + '</span></label>'; }).join('') + '</div>' +
        (q.other ? '<input type="text" class="other" name="' + name + '_other" placeholder="其他（自行填寫）">' : '');
    } else if (q.type === 'scale') {
      body = '<div class="scale"><small>' + esc(q.low || '') + '</small><div class="pills">' + [1, 2, 3, 4, 5].map(function (v) { return '<label><input type="radio" name="' + name + '" value="' + v + '"><span>' + v + '</span></label>'; }).join('') + '</div><small>' + esc(q.high || '') + '</small></div>';
    } else if (q.type === 'matrix') {
      body = '<div class="matrix">' + q.rows.map(function (r, i) { return '<div class="row"><b>' + esc(r) + '</b><div class="pills">' + [1, 2, 3, 4, 5].map(function (v) { return '<label><input type="radio" name="' + name + '_' + i + '" value="' + v + '"><span>' + v + '</span></label>'; }).join('') + '</div></div>'; }).join('') + '</div>';
    } else if (q.type === 'number') {
      body = '<div class="num"><input type="number" inputmode="decimal" name="' + name + '" min="0"><span>' + esc(q.unit || '') + '</span></div>';
    } else if (q.type === 'short') {
      body = '<input type="text" name="' + name + '" maxlength="200" placeholder="' + esc(q.placeholder || '') + '">';
    } else {
      body = '<textarea name="' + name + '" maxlength="2000"></textarea>';
    }
    html += '<div class="sv-card" data-k="' + k + '"><div class="sv-q"><span class="n">' + (k + 1) + '</span><span>' + esc(q.q) + '</span>' + (q.optional ? '<span class="opt">選填</span>' : '') + '</div>' +
      (q.hint ? '<p class="sv-hint">' + esc(q.hint) + '</p>' : '') + '<div class="sv-body">' + body + '</div><p class="sv-err">這一題還沒有填寫</p></div>';
  });
  html += '<div class="sv-submit"><button type="submit" class="btn primary">送出問卷</button><p>送出後會附上你的姓名與科系，資料只提供給老師。</p></div></form>';
  app.innerHTML = html;

  var f = app.querySelector('form');
  f.addEventListener('change', function (e) { var c = e.target.closest('.sv-card'); if (c) c.classList.remove('bad'); });
  f.onsubmit = function (e) {
    e.preventDefault();
    var bad = [], questions = [], answers = [];
    var who = { name: f._name.value.trim(), dept: f._dept.value.trim(), code: f._code.value.trim() };
    if (!who.name || !who.dept || !who.code) bad.push(app.querySelector('.sv-card.who'));
    sv.questions.forEach(function (q, k) {
      var card = app.querySelector('.sv-card[data-k="' + k + '"]'), name = 'q' + k, v = '';
      if (q.type === 'matrix') {
        var miss = false;
        q.rows.forEach(function (r, i) { var c = f.querySelector('input[name="' + name + '_' + i + '"]:checked'); questions.push(q.q.replace(/（.*?）/, '') + '：' + r); answers.push(c ? c.value : ''); if (!c) miss = true; });
        if (miss && !q.optional) bad.push(card);
        return;
      }
      if (q.type === 'multi') {
        v = [].map.call(f.querySelectorAll('input[name="' + name + '"]:checked'), function (i) { return i.value; });
        var o = f.querySelector('input[name="' + name + '_other"]'); if (o && o.value.trim()) v.push('其他：' + o.value.trim());
        v = v.join('、');
      } else if (q.type === 'single' || q.type === 'scale') {
        var c = f.querySelector('input[name="' + name + '"]:checked'); v = c ? c.value : '';
      } else { v = (f.querySelector('[name="' + name + '"]').value || '').trim(); }
      questions.push(q.q + (q.unit ? '（' + q.unit + '）' : '')); answers.push(v);
      if (!v && !q.optional) bad.push(card);
    });
    app.querySelectorAll('.sv-card').forEach(function (c) { c.classList.toggle('bad', bad.indexOf(c) > -1); });
    if (bad.length) { bad[0].scrollIntoView({ behavior: 'smooth', block: 'center' }); PixelBackend.toast('還有 ' + bad.length + ' 題沒有填寫', 'warn'); return; }
    var btn = f.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = '送出中…';
    PixelBackend.checkCode(who.code).then(function (ok) {
      if (ok === false) { btn.disabled = false; btn.textContent = '送出問卷'; app.querySelector('.sv-card.who').classList.add('bad'); app.querySelector('.sv-card.who .sv-err').textContent = '課程代碼不正確，請向老師確認'; app.querySelector('.sv-card.who').scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
      PixelBackend.saveProfile(who);
      return PixelBackend.send('survey', { title: sv.title, questions: questions, answers: answers }, { lesson: sv.lesson, okMsg: '問卷已送出' }).then(function (r) {
        var d = new Date(), stamp = (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        try { localStorage.setItem('pixel:survey-' + sv.id, stamp); } catch (e) {}
        var sent = r && r.sent;
        app.innerHTML = '<div class="sv-done"><div class="ok">✓</div><h2>' + (sent ? '問卷已送出' : '問卷已儲存') + '</h2><p>' + (sent ? '謝謝 ' + esc(who.name) + '，老師會在課前看過大家的回覆。' : '目前無法連線到後台，問卷已存在這台裝置，連線後會自動補送。') + '</p><div class="cta"><a class="btn primary" href="survey.html">回到問卷列表</a><a class="btn" href="index.html#lessons">前往課程</a></div></div>';
        scrollTo(0, 0);
      });
    });
  };
})();
</script>
